[project]
name = "river-game"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pygame-ce>=2.5.8",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                                   # import engine/, tools/ from the project root
addopts = ["--strict-markers", "--strict-config", "-m", "not perf"]  # `uv run pytest -m perf` overrides the -m
markers = ["perf: real timing (tools/bench); machine-dependent, so left out of the default run"]
xfail_strict = true
